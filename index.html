<body>
<div id="shell">
<canvas id="race" aria-label="후방 시점 레이싱 경기장"></canvas>
<div id="hud">
 <div id="top">
  <div id="badge"><div id="sub" style="display:none">GAIA</div><div id="brand">JET DUO</div><div id="speed">000 <small>KM/H</small></div></div>
 <div id="centerstats"><strong id="lap">LAP 1</strong><span id="distance">1 / 8</span><div id="boostTrack"><div id="boostFill"></div></div><span id="boostReadout">40%</span></div>
  <div id="righttop"><button id="homeRace" type="button" aria-label="메인 화면">⌂</button><button id="themeSwitch" type="button" aria-label="배경 변경">◈</button><button id="reset" type="button" aria-label="재시작">↺</button><button id="full" type="button" aria-label="전체화면">⛶</button></div>
 </div>
 <div id="mapwrap"><canvas id="map" aria-label="2D 코스 미니맵"></canvas><div id="maptitle">TOP VIEW MAP</div></div>
 <div id="toast"></div>
 <div id="controls"><div id="steer"><button class="btn" id="left" aria-label="왼쪽" type="button">◀</button><button class="btn" id="right" aria-label="오른쪽" type="button">▶</button></div><div id="actions"><button class="btn fire" id="fire" type="button" aria-label="자동 조준 버블건">●</button><button class="btn jump" id="jump" type="button" aria-label="점프">↟</button><button class="btn boost" id="boost" type="button" aria-label="부스터">⚡</button></div></div>
</div>
<div id="intro" hidden><button id="start" type="button">START</button></div>
<main id="hub" aria-label="가이아 제트 듀오 메인 메뉴">
 <section class="hub-scene">
  <img class="hub-sky" src="assets/scenery-city-river.webp" alt="도시 강변" draggable="false">
  <div class="hub-water"></div>
  <div class="hub-boat"><img src="assets/main-duo-front.webp" alt="주인공 두 명이 제트스키를 탄 정면 모습" draggable="false"></div>
  <div class="hub-title"><span class="city">GAIA CITY</span><h1>JET <em>DUO</em></h1></div>
 </section>
 <nav class="hub-menu" aria-label="메인 메뉴">
  <div class="hub-eyebrow">WATER RACING CLUB</div>
  <div class="hub-level" id="hubLevel">LEVEL 1</div>
  <div class="hub-grid">
   <button class="hub-tile" id="menuLocker" type="button"><span class="hub-icon">♛</span><span>락커룸</span></button>
   <button class="hub-tile" id="menuSchedule" type="button"><span class="hub-icon">⚑</span><span>경기 일정</span></button>
   <button class="hub-tile" id="menuTraining" type="button"><span class="hub-icon">✦</span><span>훈련</span></button>
   <button class="hub-tile" id="menuRecords" type="button"><span class="hub-icon">★</span><span>기록실</span></button>
  </div>
 </nav>
</main>
<div id="menuPanel" class="hidden" aria-label="게임 메뉴 패널"><div class="panel-shell"><header class="panel-head"><button class="panel-back" id="panelBack" type="button" aria-label="메인 메뉴로">‹</button><h2 id="panelTitle"></h2></header><div class="panel-content" id="panelContent"></div></div></div>
<div id="resultPanel" class="hidden" aria-label="경기 결과"><div class="result-box"><div class="hub-eyebrow">RACE FINISHED</div><h2 id="resultTitle">FINISH!</h2><p id="resultInfo"></p><p id="resultReward"></p><div class="result-actions"><button class="panel-action secondary" id="resultHome" type="button">메인으로</button><button class="panel-action" id="resultReplay" type="button">다시 경기</button></div></div></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('race'),ctx=canvas.getContext('2d',{alpha:false});
const mini=document.getElementById('map'),mc=mini.getContext('2d');
const speedEl=document.getElementById('speed'),distEl=document.getElementById('distance'),lapEl=document.getElementById('lap');
// Racing coordinates are intentionally exaggerated: buoy/foam travel is faster than the speedometer's physical scale.
// Scaling the oval and travel together preserves the ~90-second 5 km lap.
const WORLD_SCALE=8.2,COURSE=5000*WORLD_SCALE,LANE=210,keys={left:false,right:false,fire:false};
let w=960,h=600,dpr=1,mode='ready',last=performance.now(),elapsed=0,visualTime=0,toastTimer=0,shake=0;
const BASE_SPEED=199,BOOST_DURATION=3.2,BOOST_EXTRA=154;
const PROJECTILE_SPEED=600*WORLD_SCALE/5.2;
const WAVE_START=1050*WORLD_SCALE,WAVE_SPACING=1600*WORLD_SCALE,WAVE_DURATION=1.27;
const TRACK_RADIUS=460*WORLD_SCALE,TRACK_STRAIGHT=(COURSE-2*Math.PI*TRACK_RADIUS)/2;
const PLAYER_SPEC={accel:1.35,handling:1,grip:1,mass:1};
const SAVE_KEY='gaia-jet-duo-progress-v1';

function waveMotion(phase,power){

 if(phase<.52)return {lift:-Math.sin(Math.PI*phase/.52)*(24+48*power),submerge:0,splash:0};
 if(phase<.79){const dip=Math.sin(Math.PI*(phase-.52)/.27);return {lift:dip*(19+25*power),submerge:dip*power,splash:dip};}

function waveRibbons(){
 const first=Math.max(0,Math.floor((player.s+35-WAVE_START)/WAVE_SPACING));
 const last=Math.floor((player.s+1450-WAVE_START)/WAVE_SPACING);
 for(let i=last;i>=first;i--){
  const z=waveCenter(i,0)-player.s;if(z<35||z>1450)continue;
  const crest=[],trough=[];
  for(let j=0;j<=32;j++){
   const off=LANE*2.05*(j/16-1),p=proj(waveCenter(i,off)-player.s,off),sc=clamp(p.sc,0,7);
   const ripple=.86+.14*Math.sin(j*.64+i*1.8);

   trough.push([p.x,p.y+clamp(sc*3.6,1.3,21)]);
  }
  const nearSc=clamp(proj(z,0).sc,0,7),fade=clamp(nearSc*.27,.28,.90);

  ctx.restore();
 }
}
function drawMovingWater(hy){
 const waterId=themes[themeIndex].water;
 if(!ready(waterId))return;
 const img=art[waterId],waterH=h-hy,bandSize=34,ih=img.naturalHeight;
 const speedFeel=clamp((player.speed-55)/245,0,1),rush=clamp(player.boost/BOOST_DURATION,0,1);
 ctx.save();ctx.beginPath();ctx.rect(0,hy,w,waterH);ctx.clip();
 // Keep the painted depth colours and highlights; scroll a second copy across its surface.
 ctx.globalAlpha=.65;
 ctx.drawImage(img,0,0,img.naturalWidth,ih,0,hy,w,waterH);
 for(let yy=0;yy<waterH;yy+=bandSize){
  const band=Math.min(bandSize,waterH-yy),frac=(yy+band*.5)/waterH;
  const flow=player.s*(.10+.22*frac*frac)+visualTime*(5+19*frac)+rush*visualTime*35;
  const phase=((frac*ih+flow)%ih+ih)%ih,other=(phase+ih*.5)%ih;
  const weight=Math.sin(Math.PI*phase/ih)**2;
  const width=w+18,dx=-9+Math.sin(visualTime*3+frac*11)*4;
  const opacity=(.18+.33*Math.pow(frac,.75))*(.40+.60*speedFeel)+rush*.09;
  // Both samples fade out at their wrap seam: no sudden texture jumps during fast motion.
  ctx.globalAlpha=opacity*weight;
  ctx.drawImage(img,0,phase,img.naturalWidth,Math.min(10,ih-phase),dx,hy+yy,width,band+.7);
  ctx.globalAlpha=opacity*(1-weight);
  ctx.drawImage(img,0,other,img.naturalWidth,Math.min(10,ih-other),dx,hy+yy,width,band+.7);
 }
 ctx.restore();
}

function pathHit(ps0,pl0,ps1,pl1,os0,ol0,os1,ol1,lengthRadius,laneRadius){
 const a=(ps0-os0)/lengthRadius,b=(pl0-ol0)/laneRadius;

function friendly(a,b){return (a===player||a.side==='ally')&&(b===player||b.side==='ally')}
function nearestTarget(owner,maxRange=650){

 for(const t of [player,...activeBots]){
  if(t===owner||friendly(owner,t))continue;
  const longitudinal=Math.abs(t.s-owner.s),lateral=Math.abs(t.lane-owner.lane);
  if(longitudinal<38||longitudinal>maxRange||lateral>235)continue;

}

function road(){const far=1400,step=28,segments=[];for(let z=far;z>=55;z-=step)segments.push({z,l:proj(z,-LANE),r:proj(z,LANE),c:proj(z,0)});for(let i=0;i<segments.length-1;i++){const a=segments[i],b=segments[i+1];const t=clamp((b.c.y-h*.21)/(h*.79),0,1);const bright=(Math.floor((player.s+a.z)/170)%2===0)?1:0;poly([[a.l.x,a.l.y],[a.r.x,a.r.y],[b.r.x,b.r.y],[b.l.x,b.l.y]],bright?'#2ec9db55':'#26b4d155');
if(i%3===0){const f=clamp(t*.7,.05,.6);line([[a.l.x,a.l.y],[b.l.x,b.l.y]],'#d5ffff'+Math.round(f*255).toString(16).padStart(2,'0'),Math.max(1,2*t));line([[a.r.x,a.r.y],[b.r.x,b.r.y]],'#d5ffff'+Math.round(f*255).toString(16).padStart(2,'0'),Math.max(1,2*t))}}
ctx.save();ctx.strokeStyle='#c5ffff';for(let i=0;i<segments.length-1;i+=4){const a=segments[i],b=segments[i+1];ctx.globalAlpha=clamp((b.c.y-h*.21)/(h*.5),.06,.4);ctx.lineWidth=1+3*clamp((b.c.y-h*.21)/(h*.6),0,1);line([[a.l.x,a.l.y],[b.l.x,b.l.y]],'#e4ffff',ctx.lineWidth);line([[a.r.x,a.r.y],[b.r.x,b.r.y]],'#e4ffff',ctx.lineWidth)}ctx.restore();
// Gentle elevated water ridges share their world position with the buoyancy response.
waveRibbons();
// 원근 깊이순: 멀리 있는 작은 부표를 먼저, 가까운 큰 부표를 나중에 그린다.
const firstBuoy=Math.ceil((player.s+60)/210)*210,lastBuoy=Math.floor((player.s+1399)/210)*210;
for(let s=lastBuoy;s>=firstBuoy;s-=210){const z=s-player.s,side=Math.floor(s/210)%2===0?-1:1;const p=proj(z,side*(LANE+16));if(p.y<h*.21||p.y>h+100)continue;const size=clamp(38*p.sc,3,36);buoy(p.x,p.y,size,side,s)}
for(let s=Math.ceil((player.s+70)/120)*120;s<player.s+1400;s+=120){const z=s-player.s,p=proj(z,-LANE*.18);if(p.y>h)continue;const width=clamp(p.sc*15,1,28);ctx.globalAlpha=.18;ctx.strokeStyle='#fff';ctx.lineWidth=width*.15;ctx.beginPath();ctx.ellipse(p.x,p.y,Math.max(2,width),Math.max(1,width*.12),0,0,Math.PI);ctx.stroke();ctx.globalAlpha=1}}
function buoy(x,y,sz,side,at){
 softShadow(x+3,y+sz*.07,sz*1.18,Math.max(2,sz*.35),.86);
 ctx.save();ctx.translate(x,y);
 const floatY=Math.sin(visualTime*1.55+x*.009)*Math.min(2.6,sz*.07);
 ctx.translate(0,floatY);
 const hit=buoyReactions.get(at);
 if(hit){const age=visualTime-hit.at;ctx.rotate(Math.sin(age*23)*Math.exp(-age*5)*hit.side*.24)}
 if(ready('buoys')){
  const img=art.buoys,cell=img.naturalWidth/2,srcX=side===-1?0:cell,drawSz=sz*2.2;
  ctx.drawImage(img,srcX,0,cell,img.naturalHeight,-drawSz*.5,-drawSz,drawSz,drawSz);
 }else{
  ctx.fillStyle=side===-1?'#ff507b':'#ffe07e';ctx.beginPath();ctx.moveTo(0,-sz*1.5);ctx.lineTo(sz*.43,-sz*.55);ctx.lineTo(sz*.5,0);ctx.quadraticCurveTo(0,sz*.26,-sz*.5,0);ctx.lineTo(-sz*.43,-sz*.55);ctx.closePath();ctx.fill();ctx.fillStyle='#fffbd4';ctx.fillRect(-sz*.3,-sz*.46,sz*.6,sz*.15);
 }ctx.restore();
}
function craft(x,y,size,color,lean,shadow=true,air=0){
 if(shadow)softShadow(x,y+size*.33,size*.68,size*.2,air>0?.35:.83);
 ctx.save();ctx.translate(x,y-air);ctx.rotate(lean*.11);const sc=clamp(size/84,.05,3);ctx.scale(sc,sc);
ctx.fillStyle='#e0ffffb5';ctx.beginPath();ctx.ellipse(0,34,55,8,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#072e56';poly([[-37,20],[-26,-28],[-15,-54],[0,-66],[15,-54],[26,-28],[37,20],[18,30],[-18,30]],'#032849');
ctx.fillStyle=color;poly([[-31,16],[-21,-24],[-9,-49],[0,-54],[9,-49],[21,-24],[31,16],[15,25],[-15,25]],color);
ctx.fillStyle='#e9fcff';ctx.globalAlpha=.5;poly([[-8,-47],[0,-55],[8,-47],[11,-24],[-11,-24]],'#fff');ctx.globalAlpha=1;
// passenger (back seat)
ctx.fillStyle='#272353';ctx.beginPath();ctx.ellipse(0,3,23,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fa8fc9';ctx.beginPath();ctx.ellipse(0,-2,18,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffc6a5';ctx.beginPath();ctx.arc(0,-16,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#61408d';ctx.beginPath();ctx.arc(0,-19,13,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-13,-19,5,13);
// driver (front seat)
ctx.fillStyle='#16355b';ctx.beginPath();ctx.ellipse(0,-29,18,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6de5eb';ctx.beginPath();ctx.ellipse(0,-31,14,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3b994';ctx.beginPath();ctx.arc(0,-46,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#392e63';ctx.beginPath();ctx.arc(0,-49,11,Math.PI,Math.PI*2);ctx.fill();
ctx.strokeStyle='#f2c4a8';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-12,-33);ctx.lineTo(-22,-25);ctx.moveTo(12,-33);ctx.lineTo(22,-25);ctx.stroke();ctx.strokeStyle='#17294d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-28,-25);ctx.lineTo(28,-25);ctx.stroke();ctx.restore()}
function drawHeart(x,y,size,phase){
 ctx.save();ctx.translate(x,y+Math.sin(visualTime*3+phase)*size*.18);ctx.scale(size/23,size/23);
 ctx.shadowColor='#ff5fe5';ctx.shadowBlur=16;ctx.strokeStyle='#ffb8f7';ctx.lineWidth=3.5;ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-27,-3,-9,-20,0,-8);ctx.bezierCurveTo(9,-20,27,-3,0,10);ctx.stroke();
 ctx.shadowBlur=0;ctx.strokeStyle='#fff8f9';ctx.lineWidth=1.3;ctx.stroke();ctx.restore();
}
function pickups(){
 for(const heart of hearts){const z=heart.nextS-player.s;if(heart.taken||z<40||z>1400)continue;
  const p=proj(z,heart.lane),size=clamp(p.sc*14,3,28);
  if(p.y<h*.21||p.y>h+40)continue;
  drawHeart(p.x,p.y-size*2.1,size,heart.s*.01);
 }
}
function waterShots(){
 for(const shot of shots){const z=shot.s-player.s;if(z<35||z>1400)continue;
  const p=proj(z,shot.lane),r=clamp(p.sc*5,2.2,18),up=p.y-r*1.8;
  ctx.save();ctx.shadowColor=shot.owner===player?'#74efff':'#ff9bdc';ctx.shadowBlur=r*.8;
  const bubble=ctx.createRadialGradient(p.x-r*.28,up-r*.36,r*.1,p.x,up,r);
  bubble.addColorStop(0,'#ffffffda');bubble.addColorStop(.28,'#a9f8ffe8');bubble.addColorStop(.68,shot.owner===player?'#48cdfa82':'#ee89e590');bubble.addColorStop(1,'#f1ffff12');
  ctx.fillStyle=bubble;ctx.beginPath();ctx.arc(p.x,up,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#e7ffffc9';ctx.lineWidth=Math.max(1,r*.18);ctx.stroke();
  ctx.fillStyle='#fff';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(p.x-r*.33,up-r*.32,r*.17,0,Math.PI*2);ctx.fill();ctx.restore();
 }
}
function impactEffects(){
 for(const burst of bursts){
  const isPlayer=burst.target===player;
  const z=burst.target.s-player.s;
  if(!isPlayer&&(z<60||z>1400))continue;
  const p=isPlayer?{x:w*.5,y:h*.72,sc:1}:proj(z,burst.target.lane);
  const size=isPlayer?Math.min(w,h)*.13:clamp(p.sc*16,8,50);
  const life=1-burst.age/.64,boom=burst.heavy?1.55:1;
  ctx.save();ctx.globalAlpha=life*.90;ctx.lineCap='round';
  for(let i=0;i<9;i++){
   const angle=i*Math.PI*2/9+burst.seed,radius=(.25+burst.age*2.3)*size*boom;
   const x=p.x+Math.cos(angle)*radius,y=p.y-size*.55+Math.sin(angle)*radius*.72;
   const drop=size*(burst.heavy?.14:.095)*life;
   ctx.fillStyle=i%3===0?'#ffffff':'#a7f4ff';ctx.beginPath();ctx.arc(x,y,Math.max(.7,drop),0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle='#b8ffff';ctx.lineWidth=Math.max(1,size*.06*life);
  ctx.beginPath();ctx.ellipse(p.x,p.y-size*.55,size*(.2+burst.age*1.25)*boom,size*(.13+burst.age*.58)*boom,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
 }
}
function rivals(){
 const visible=activeBots.map(b=>({...b,z:b.s-player.s})).filter(b=>b.z>60&&b.z<1400).sort((a,b)=>b.z-a.z);
 for(const b of visible){
  const p=proj(b.z,b.lane);if(p.y<h*.26||p.y>h+110)continue;
  const size=clamp(p.sc*90,6,180),lean=clamp(b.sideVel/(100+b.speed*.5)-curveAt(b.s)*TRACK_RADIUS*.42+Math.sin(elapsed*2+b.wave)*.05,-1,1);
  const id=b.id+'_'+(b.fire>0?'attack':'move'),imageId=ready(id)?id:'dummy';
  if(ready(imageId)){
   const img=art[imageId],jetSide=size*1.38,botBottom=p.y+size*.36,frame=spriteFrame(lean),cell=img.naturalWidth/3;
   const frameW=jetSide*cell/img.naturalHeight;
   const waveRise=swellAt(b.s,b.lane)*Math.min(17,jetSide*.055)+(b.air>0?Math.sin((1-b.air/1.1)*Math.PI)*Math.min(34,jetSide*.20):0);
   softShadow(p.x,botBottom-jetSide*.04,jetSide*.47,Math.max(2,jetSide*.11),.78-waveRise*.012);
   wakeArt(p.x,botBottom,jetSide,lean,waveRise,b.impact,b.boost,true,b.speed);
   const bob=jetBob(b.wave,b.speed)*clamp(jetSide/390,.25,.8),hitIntensity=clamp(b.impact/.62,0,1);
   const roll=lean*.013+Math.sin(visualTime*2+b.wave)*.009+Math.sin(visualTime*26+b.wave)*hitIntensity*.095+b.hitLean*hitIntensity*.16;
   ctx.save();ctx.translate(p.x+b.hitLean*hitIntensity*size*.11,botBottom+bob-waveRise-Math.sin(hitIntensity*Math.PI)*hitIntensity*size*.10);ctx.rotate(roll);
   ctx.drawImage(img,frame*cell,0,cell,img.naturalHeight,-frameW*.5,-jetSide,frameW,jetSide);ctx.restore();
  }else{craft(p.x,p.y,size,b.col,lean,true,0)}
 }
}
function playerCraft(){
 const air=player.air>0?Math.sin((1-player.air/1.15)*Math.PI)*Math.min(75,h*.13):0;
 const wave=waveMotion(player.wavePhase,player.wavePower);
 const slide=clamp(player.sideVel/(86+player.speed*.56),-1,1);
 const visualLean=clamp(player.lean*.72+slide*.45-curveAt(player.s)*TRACK_RADIUS*.25,-1,1);
 const x=w*.5+visualLean*15,y=h*.80,scale=clamp(Math.min(w,h)*.29,98,180);
 if(player.boost>0){ctx.save();ctx.globalAlpha=.18+.62*clamp(player.boost/BOOST_DURATION,0,1);ctx.strokeStyle='#ffe6a1';ctx.lineWidth=3;for(let i=0;i<10;i++){const yy=y+Math.random()*h*.3;ctx.beginPath();ctx.moveTo(x+(Math.random()-.5)*180,yy);ctx.lineTo(x+(Math.random()-.5)*190,yy+28);ctx.stroke()}ctx.restore()}
 if(!ready('straight')){
  ctx.save();ctx.globalAlpha=.65;ctx.strokeStyle='#e9ffff';ctx.lineWidth=3;for(let i=0;i<7;i++){const dx=(i-3)*18,n=(elapsed*200+i*33)%145;ctx.beginPath();ctx.moveTo(x+dx*.5,y+25+n*.25);ctx.lineTo(x+dx*1.1,y+38+n*.8);ctx.stroke()}ctx.restore();craft(x,y,scale,'#e9faff',visualLean,true,air);return;
 }
 const spriteH=clamp(Math.min(w,h)*.52,210,390),spriteW=spriteH*.75,bottom=h*.96,frame=spriteFrame(visualLean);
 const airborne=air>0||wave.lift<-.5;
 softShadow(x,bottom-8,spriteW*.60,spriteH*.125,airborne?clamp(.96+(wave.lift-air)/120,.30,.94):.96);
 wakeArt(x,bottom,spriteH,visualLean,airborne?Math.max(air,-wave.lift):0,Math.max(player.landing,player.impact,wave.splash*.57),player.boost,false,player.speed);
 const shooting=player.fire>0,shotKeys=player.fireMode===1?['frontStraight','frontLeft','frontRight']:['fireStraight','fireLeft','fireRight'];
 const key=shooting?shotKeys[frame]:['straight','left','right'][frame],id=ready(key)?key:'straight';
 const bob=airborne?0:jetBob(.35,player.speed),landAge=1-player.landing/.55;
 const recoil=player.landing>0?Math.sin(landAge*Math.PI*3)*(player.landing/.55)*11:0;
 const impactStrength=player.impact/.5;
 const hitRecoil=player.impact>0?-Math.sin((1-impactStrength)*Math.PI)*impactStrength*13:0;
 const wavePitch=wave.lift<0?clamp(-wave.lift/75,0,1)*-.015:clamp(wave.submerge,0,1)*.021;
 const roll=visualLean*.036+Math.sin(visualTime*(1.6+player.speed*.004))*.012+player.hitLean*impactStrength*.19+wavePitch;
 ctx.save();ctx.translate(x+player.hitLean*impactStrength*22,bottom-air+wave.lift+bob+recoil+hitRecoil);ctx.rotate(roll);
 ctx.drawImage(art[id],-spriteW*.5,-spriteH,spriteW,spriteH);ctx.restore();
 if(shooting){
  // Each muzzle pulse is a discrete round bubble, never a continuous water beam.
  const front=player.fireMode===1,mx=x+spriteW*(front?.20:.14),my=bottom-spriteH*(front?.79:.42);
  ctx.save();ctx.shadowColor='#b9ffff';ctx.shadowBlur=13;
  for(let i=0;i<3;i++){
   const age=(.20-player.fire)*2.2+i*.11,px=mx+(front?14:-14)*age*2+i*2,py=my+(front?-32:20)*age*2;
   const r=clamp(9-i*2+age*5,2,12);
   ctx.fillStyle='#9bf7ffac';ctx.strokeStyle='#f5ffffe8';ctx.lineWidth=1.5;
   ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.stroke();
  }
  ctx.restore();
 }
 // A precomposed transparent water sheet passes in front of the hull only at the splashdown trough.
 if(wave.submerge>.04&&ready('waveFront')){
  ctx.save();ctx.globalAlpha=clamp(wave.submerge*.95,0,.95);
  ctx.drawImage(art.waveFront,x-spriteW*.83,bottom-spriteH*.25,spriteW*1.66,spriteH*.49);
  ctx.restore();
 }
}
function mapDraw(){
 const cw=mini.width/2,ch=mini.height/2;mc.clearRect(0,0,cw,ch);
 const scale=Math.min((cw-18)/(TRACK_RADIUS*2+LANE*2),(ch-14)/(TRACK_STRAIGHT+TRACK_RADIUS*2+LANE*2));
 const point=(s,lane=0)=>{const t=laneOnTrack(s,lane);return{x:cw*.5+t.x*scale,y:ch*.5-t.y*scale}};
 mc.strokeStyle='#89d8f550';mc.lineWidth=9;mc.beginPath();
 for(let i=0;i<=100;i++){const p=point(COURSE*i/100);if(i===0)mc.moveTo(p.x,p.y);else mc.lineTo(p.x,p.y)}mc.closePath();mc.stroke();
 mc.strokeStyle='#9afaff';mc.lineWidth=1.8;mc.stroke();
 const marker=(s,l,col,r)=>{const p=point(s,l);mc.fillStyle=col;mc.beginPath();mc.arc(p.x,p.y,r,0,Math.PI*2);mc.fill()};
 for(const b of activeBots)marker(b.s,b.lane,b.col,2.6);
 marker(player.s,player.lane,'#fff',4);
}
function render(){ctx.save();ctx.clearRect(0,0,w,h);if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake*.6);background();road();pickups();rivals();waterShots();playerCraft();impactEffects();ctx.restore();mapDraw()}
function frame(now){const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;if(mode==='running'){visualTime+=dt;update(dt);render()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
